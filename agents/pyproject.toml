[project]
name = "cubicle-agents"
version = "0.1.0"
description = "Cubicle's AI staff: the Python agent worker that plans, delegates and does your daily work."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cubicle contributors" }]
dependencies = [
    "anthropic>=1.15",
    "httpx>=0.27",
    "openai>=1.100",
    "pydantic-ai-slim[anthropic,duckduckgo,mcp,openai]>=2.58",
]

[project.scripts]
cubicle-agents = "cubicle_agents.cli:main"

[dependency-groups]
dev = [
    "fastmcp-slim[server]>=4.1.1",
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubicle_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["cubicle_agents"]
known-local-folder = ["fakes"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
