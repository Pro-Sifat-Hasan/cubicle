name: Release

# Push a tag like v0.1.0 on main to build the Windows installer and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version ("${{ github.ref_name }}".TrimStart("v"))
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cubicle-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cubicle:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cubicle:latest
