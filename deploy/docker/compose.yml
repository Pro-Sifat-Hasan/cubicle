# Run your office on a server / always-on machine:
#   docker compose -f deploy/docker/compose.yml up -d --build
#   docker compose -f deploy/docker/compose.yml exec cubicle cat /data/admin.token
services:
  cubicle:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: cubicle:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:7878:7878" # loopback only; use a TLS reverse proxy (e.g. Caddy) for remote access
    volumes:
      - cubicle-data:/data
    environment:
      CUBICLE_OWNER_NAME: "${CUBICLE_OWNER_NAME:-the owner}"
      CUBICLE_DAILY_TOKEN_BUDGET: "${CUBICLE_DAILY_TOKEN_BUDGET:-2000000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cubicle-data:
